name: Port

# The native port (port/), 32-bit: a Windows zip, and for Linux a portable tarball and a .deb. Each job runs
# a script of port/packaging in a container, the same command as a local run (port/README.md, Packages).
on:
  push:
    branches: ['port/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: port-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mingw32
            image: debian:trixie
            setarch: ''
            artifact: gta2_re-windows-i686
          # i386 userland: GCC and the system root's wayland-scanner run natively.
          - target: linux32
            image: i386/debian:trixie
            setarch: linux32
            artifact: gta2_re-linux-i686
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version and work folder
        run: |
          echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=$GITHUB_REF_NAME; else v=$(git rev-parse --short HEAD); fi
          echo "GTA2_VERSION=$v" >> "$GITHUB_ENV"

      - name: Restore libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/work/dl
            ${{ runner.temp }}/work/deps-${{ matrix.target }}
          key: port-deps-${{ matrix.target }}-${{ hashFiles('port/packaging/versions.sh', 'port/packaging/deps.sh', 'port/packaging/ci.sh', 'port/packaging/sysroot.sh', 'port/packaging/linux32-sysroot.cmake', 'port/packaging/glibc_compat.c') }}

      - name: Build and package
        run: |
          mkdir -p "$WORK"
          docker run --rm -e GTA2_VERSION -v "$PWD:/src:ro" -v "$WORK:/work" -w /src ${{ matrix.image }} \
              ${{ matrix.setarch }} sh port/packaging/ci.sh ${{ matrix.target }} /work
          docker run --rm -v "$WORK:/work" ${{ matrix.image }} chown -R "$(id -u):$(id -g)" /work

      - name: Smoke tests in clean containers
        if: matrix.target == 'linux32'
        run: |
          set -f
          for pkg in "debian:bookworm *.tar.gz" "ubuntu:24.04 *.tar.gz" "archlinux:latest *.tar.gz" \
                     "debian:trixie *.deb" "ubuntu:24.04 *.deb"; do
              set -- $pkg
              echo "::group::$1 $2"
              docker run --rm -v "$WORK/out:/out:ro" -v "$PWD/port/packaging:/p:ro" "$1" sh -c "sh /p/smoke_test.sh /out/$2"
              echo "::endgroup::"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/work/out/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME"
