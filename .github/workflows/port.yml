name: Port

# The native port (port/). Each job runs a script of port/packaging, in a container on Linux, the same
# command as a local run (port/README.md, Packages). Releases are 64-bit: Windows x64, Linux x86_64 (tarball
# and AppImage), Flatpak and macOS.
# A tag v<x.y.z> (pushed, or run on by release.yml) builds that version and drafts its release.
on:
  push:
    branches: ['main', 'port/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: port-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The scripts' version: the tag on a tag, else CMake's default.
env:
  GTA2_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mingw64
            image: debian:trixie
            setarch: ''
            artifact: reG2-windows-x86_64
          - target: linux64
            image: debian:trixie
            setarch: ''
            artifact: reG2-linux-x86_64
            smoke: debian:bullseye debian:bookworm ubuntu:24.04 archlinux:latest
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Work folder
        run: echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"

      - name: Restore libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/work/dl
            ${{ runner.temp }}/work/deps-${{ matrix.target }}
          key: port-deps-${{ matrix.target }}-${{ hashFiles('port/packaging/versions.sh', 'port/packaging/deps.sh', 'port/packaging/ci.sh', 'port/packaging/sysroot.sh', 'port/packaging/*.cmake', 'port/packaging/glibc_compat.c') }}

      - name: Build and package
        run: |
          mkdir -p "$WORK"
          docker run --rm -e GTA2_VERSION -v "$PWD:/src:ro" -v "$WORK:/work" -w /src ${{ matrix.image }} \
              ${{ matrix.setarch }} sh port/packaging/ci.sh ${{ matrix.target }} /work
          docker run --rm -v "$WORK:/work" ${{ matrix.image }} chown -R "$(id -u):$(id -g)" /work

      # Each package in each image: the tarball, and for linux64 the AppImage.
      - name: Smoke tests in clean containers
        if: matrix.smoke
        run: |
          for image in ${{ matrix.smoke }}; do
              for pkg in $(cd "$WORK/out" && ls *.tar.gz *.AppImage 2> /dev/null); do
                  echo "::group::$image $pkg"
                  docker run --rm -v "$WORK/out:/out:ro" -v "$PWD/port/packaging:/p:ro" "$image" sh /p/smoke_test.sh "/out/$pkg"
                  echo "::endgroup::"
              done
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/work/out/*
          if-no-files-found: error
          retention-days: 3

  flatpak:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      # What bwrap needs in a container, short of --privileged.
      BWRAP: --security-opt seccomp=unconfined --security-opt apparmor=unconfined --security-opt systempaths=unconfined
    steps:
      - uses: actions/checkout@v4

      - name: Work folder
        run: echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"

      # Ubuntu 24.04 keeps unprivileged processes from creating the user namespaces bwrap needs.
      - name: Allow user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      # flatpak-builder's downloads and the libraries' build stages; the game's module always builds.
      - name: Restore flatpak-builder's cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/work/state
          key: port-flatpak-${{ hashFiles('port/packaging/flatpak/*', 'port/packaging/versions.sh') }}

      # The runtimes in a volume: flatpak cannot update them inside the image's overlay (EXDEV).
      - name: Build
        run: |
          mkdir -p "$WORK"
          docker run --rm $BWRAP -e GTA2_VERSION -v "$PWD:/src:ro" -v "$WORK:/work" -v flatpak-var:/var/lib/flatpak -w /src $IMAGE \
              sh port/packaging/flatpak.sh /work
          docker run --rm -v "$WORK:/work" debian:trixie chown -R "$(id -u):$(id -g)" /work

      - name: Smoke test on Debian 13 with Flatpak
        run: |
          docker run --rm $BWRAP -v "$WORK/out:/out:ro" -v "$PWD/port/packaging:/p:ro" debian:trixie \
              sh -c 'sh /p/flatpak_smoke_test.sh /out/*.flatpak'

      - uses: actions/upload-artifact@v4
        with:
          name: reG2-flatpak
          path: ${{ runner.temp }}/work/out/*.flatpak
          if-no-files-found: error
          retention-days: 3

  # Untested by the maintainers: built and started without game data only. The app is signed ad hoc.
  # One universal app (arm64 and x86_64) from the Intel runner; the start test runs its x86_64 code.
  macos:
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4

      - name: Work folder
        run: echo "WORK=$RUNNER_TEMP/work" >> "$GITHUB_ENV"

      - name: Restore libraries
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/work/dl
            ${{ runner.temp }}/work/deps-macos
          key: port-deps-macos-universal-${{ hashFiles('port/packaging/versions.sh', 'port/packaging/deps.sh') }}

      - name: Build and package
        run: |
          brew install ninja
          P=port/packaging
          sh $P/fetch.sh "$WORK/dl" SDL3-3.4.18.tar.gz openal-soft-1.25.2.tar.gz unshield-1.6.2.tar.gz \
              libarchive-3.8.11.tar.xz zlib-1.3.2.tar.gz xz-5.8.4.tar.gz
          if [ ! -f "$WORK/deps-macos/.complete" ]; then
              rm -rf "$WORK/deps-macos"
              sh $P/deps.sh macos "$WORK/dl" "$WORK/deps-macos" "$WORK/b_deps"
          fi
          sh $P/build.sh macos "$WORK/deps-macos" "$WORK/build"
          sh $P/macos_app.sh "$WORK/build" "$WORK/deps-macos" "$WORK/out"

      - name: Start without game data
        run: |
          T=$(mktemp -d)
          rc=0
          GTA2_NO_SOUND=1 GTA2_NO_MESSAGEBOX=1 SDL_VIDEODRIVER=dummy GTA2_LOG_FILE=$T/dummy.log \
              "$WORK/build/reg2.app/Contents/MacOS/reg2" || rc=$?
          cat "$T/dummy.log"
          [ $rc = 0 ]
          grep -q "game files were not found" "$T/dummy.log"

      - uses: actions/upload-artifact@v4
        with:
          name: reG2-macos
          path: ${{ runner.temp }}/work/out/*.dmg
          if-no-files-found: error
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, flatpak, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The 64-bit packages only (the reG2-* artifacts).
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: reG2-*
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "reG2 ${GTA2_VERSION#v}"
