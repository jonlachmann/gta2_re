name: CI

on: [push, pull_request]

jobs:
    # ======================================
    #      Windows vc2019
    # ======================================

  build-windows-latest:
    runs-on: windows-2022
    name: Windows_VC_Latest

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build on Windows (Windows_VC_Latest)
      run: |
        mkdir build_vc_latest
        cd build_vc_latest
        cmake .. -G"Visual Studio 17 2022" -A Win32
        cmake --build . --target decomp_main --config Release
        cd ..

    - name: Upload artifacts on Windows (Windows_VC_Latest)
      uses: actions/upload-artifact@v4
      with:
        name: Windows_VC_Latest_main_exe
        path: build_vc_latest/Release/decomp_main.exe
        retention-days: 7

    # ======================================
    #      Windows vc6
    # ======================================

  build-windows-vc6:
    runs-on: windows-latest
    name: Windows_VC6

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore cached binaries
      id: cache
      uses: actions/cache@v3
      with:
        enableCrossOsArchive: true
        path: |
          Scripts/bin_comp/9.6f.exe
          Scripts/bin_comp/10.5.exe
        key: originals

    - name: Build on Windows (Windows_VC6)
      run: |
        pip install -r requirements.txt
        python vc6_setup.py
        # build.log keeps the compiler output (warnings) for the run
        python build.py 2>&1 | Tee-Object -FilePath build.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        build_vc6/decomp_main.exe --check_vars_only

    - name: Upload artifacts on Windows (Windows_VC6)
      uses: actions/upload-artifact@v4
      with:
        name: windows_vc6_main_exe
        path: build_vc6/decomp_main.exe
        retention-days: 7

    - name: Restore progress.json from cache (Windows_VC6)
      if: github.event_name == 'push'
      id: cache-progress
      uses: actions/cache/restore@v4
      with:
        path: ./Scripts/progress.json
        key: progress-json-${{ github.event.before }}

    # The WIP scores on discord compare the WIP functions with the original, so rebuild the files that
    # use WIP_IMPLEMENTED/NOT_IMPLEMENTED without the logging code (after the exe was uploaded above)
    - name: Rebuild WIP functions without logging (Windows_VC6)
      if: github.event_name == 'push' && !github.event.repository.fork
      run: |
        python build.py --ignore_no_match --no_wip_logging
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: "Post function status on discord (Windows_VC6)"
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      if: github.event_name == 'push' && !github.event.repository.fork
      run: |
        cd .\Scripts
        python report_progress_to_discord.py

    - name: Save progress.json to cache (Windows_VC6)
      if: github.event_name == 'push'
      uses: actions/cache/save@v4
      with:
        path: ./Scripts/progress.json
        key: progress-json-${{ github.sha }}

    # ======================================
    #      Reccmp
    # ======================================

  reccmp:
    runs-on: windows-latest
    name: Reccmp_VC6

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Restore cached binaries
      id: cache
      uses: actions/cache@v3
      with:
        enableCrossOsArchive: true
        path: |
          Scripts/bin_comp/9.6f.exe
          Scripts/bin_comp/10.5.exe
        key: originals

    - name: Build on Windows (Windows_VC6)
      run: |
        pip install -r requirements.txt
        pip install git+https://github.com/isledecomp/reccmp
        python vc6_setup.py
        python build.py --reccmp
        build_vc6/decomp_main.exe --check_vars_only

    - name: Setup Reccmp
      run: |
        copy build_vc6/decomp_main.exe build_vc6/9.6f.exe
        copy build_vc6/decomp_main.pdb build_vc6/9.6f.pdb
        copy build_vc6/decomp_main.exe build_vc6/10.5.exe
        copy build_vc6/decomp_main.pdb build_vc6/10.5.pdb
        reccmp-project detect --what original   --search-path Scripts/bin_comp
        reccmp-project detect --what recompiled --search-path build_vc6

    - name: Reccmp 10.5
      run: |
        reccmp-reccmp --target 105 --html reccmp-105.html

    - name: Reccmp 9.6f
      run: |
        reccmp-reccmp --target 96f --html reccmp-96f.html

    - name: Upload artifacts on Windows (Windows_VC6)
      uses: actions/upload-artifact@v4
      with:
        name: reccmp-105
        path: |
          build_vc6/decomp_main.exe
          build_vc6/decomp_main.pdb
          reccmp-96f.html
          reccmp-105.html
        retention-days: 7

    - name: Compare variables
      continue-on-error: true  # For initial PR. Remove once the reported diffs are solved.
      run: |
        reccmp-datacmp --target 105

    # ======================================
    #      Linux vc6
    # ======================================

  build-linux-vc6:
    runs-on: ubuntu-latest
    name: Linux_wine_VC6

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies on Linux
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y xvfb wine64 wine32

    - name: Restore cached binaries
      id: cache
      uses: actions/cache@v3
      with:
        enableCrossOsArchive: true
        path: |
          Scripts/bin_comp/9.6f.exe
          Scripts/bin_comp/10.5.exe
        key: originals

    - name: Build on Linux
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install -r requirements.txt
        python3 vc6_setup.py
        python3 build.py

    - name: Upload artifacts on Linux
      uses: actions/upload-artifact@v4
      with:
        name: linux_vc6_main_exe
        path: build_vc6/decomp_main.exe
        retention-days: 7

    # ======================================
    #      OpenGL renderer DLLs (MinGW)
    # ======================================

  build-opengl-renderer:
    runs-on: ubuntu-latest
    name: OpenGL_Renderer

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install MinGW and GL headers
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-mingw-w64-i686 libgl-dev

    - name: Build and test
      run: |
        cmake -S Renderers/OpenGL -B build_gl -DCMAKE_TOOLCHAIN_FILE=$PWD/Port/cmake/mingw-gcc.cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build_gl
        cmake -S Renderers/OpenGL -B build_gl_test
        cmake --build build_gl_test
        ctest --test-dir build_gl_test --output-on-failure

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: opengl_renderer_dlls
        path: |
          build_gl/glrender.dll
          build_gl/glvideo.dll
          Renderers/OpenGL/gta2gl.ini.example
        retention-days: 7

    # ======================================
    #      Port (Linux, native)
    # ======================================

  build-port-linux:
    runs-on: ubuntu-latest
    name: Port_Linux

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install clang, lld and GL headers
      run: |
        sudo apt-get update
        sudo apt-get install -y clang lld ninja-build libgl-dev libegl-dev

    # Ubuntu 24.04 has no SDL3 package; a console build is enough for the build and the tests
    - name: Build SDL3
      run: |
        git -c advice.detachedHead=false clone --depth 1 -b release-3.2.0 https://github.com/libsdl-org/SDL /tmp/SDL
        cmake -S /tmp/SDL -B /tmp/SDL/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_UNIX_CONSOLE_BUILD=ON
        cmake --build /tmp/SDL/build
        sudo cmake --install /tmp/SDL/build

    - name: Build and test
      run: |
        cmake -S Port -B build_port/ci -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
        cmake --build build_port/ci
        ctest --test-dir build_port/ci --output-on-failure
